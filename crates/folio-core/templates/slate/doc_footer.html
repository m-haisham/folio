<div
    style="
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background-color: #0f172a;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
    "
>
    <div
        style="
            font-family: system-ui, sans-serif;
            font-size: 8px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0.8in 0;
        "
    >
        <span
            >{% if me and me.name %}{{ me.name }}{% if me.company %} · {{
            me.company }}{% endif %}{% endif %}</span
        >
        <span>{% if me and me.email %}{{ me.email }}{% endif %}</span>
    </div>
</div>
