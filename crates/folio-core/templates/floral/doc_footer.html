<div
    style="
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background-color: #fdf8f2;
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
    "
>
    <div
        style="-webkit-print-color-adjust: exact; print-color-adjust: exact; height: 3px; width: 100%; background: {% if theme %}{{ theme.primary }}{% else %}#7c3516{% endif %};"
    ></div>
    <div
        style="
            font-family: Georgia, serif;
            font-size: 8px;
            color: #a0522d;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0.8in 0;
        "
    >
        <span
            >{% if me and me.name %}{{ me.name }}{% if me.company %} · {{
            me.company }}{% endif %}{% endif %}</span
        >
        <span>{% if me and me.email %}{{ me.email }}{% endif %}</span>
    </div>
</div>
