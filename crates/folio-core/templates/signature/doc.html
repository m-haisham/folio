<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ title | default(value="Document") }}</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @media print {
                body {
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }
            }
            @import url("https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap");
            :root {
                --ink: #1c3325;
                --ink-mid: #3a6b4c;
                --ink-muted: #4a6b59;
                --ink-sub: #6b8878;
                --paper: #fcfaf8;
                --rule: rgba(28, 51, 37, 0.1);
                --rule-md: rgba(28, 51, 37, 0.22);
            }

            @page {
                background: var(--paper);
            }

            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                background: var(--paper);
                box-sizing: border-box;
            }

            body {
                color: var(--ink);
                font-family: "Inter", system-ui, sans-serif;
                font-weight: 300;
            }

            .serif {
                font-family: "EB Garamond", Georgia, serif;
            }

            .doc-body {
                font-family: "EB Garamond", Georgia, serif;
                font-size: 1rem;
            }
            .doc-body h1 {
                font-family: "EB Garamond", serif;
                font-size: 1.5rem;
                font-weight: 500;
                font-style: italic;
                margin: 2.25rem 0 0.75rem;
                color: var(--ink);
            }
            .doc-body h2 {
                font-family: "Inter", sans-serif;
                font-size: 0.72rem;
                font-weight: 600;
                margin: 2.25rem 0 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                color: var(--ink-sub);
                border-bottom: 1px solid var(--rule);
                padding-bottom: 0.4rem;
            }
            .doc-body h3 {
                font-family: "EB Garamond", serif;
                font-size: 1.1rem;
                font-weight: 500;
                font-style: italic;
                margin: 1.75rem 0 0.5rem;
                color: var(--ink-mid);
            }
            .doc-body p {
                margin: 1.1rem 0;
                line-height: 1.85;
            }
            .doc-body ul,
            .doc-body ol {
                margin: 1rem 0 1rem 1.5rem;
            }
            .doc-body ul {
                list-style-type: disc;
            }
            .doc-body ol {
                list-style-type: decimal;
            }
            .doc-body ul ul {
                list-style-type: circle;
            }
            .doc-body ul ul ul {
                list-style-type: square;
            }
            .doc-body li {
                margin-bottom: 0.3rem;
                line-height: 1.8;
            }
            .doc-body blockquote {
                border-left: 2px solid var(--ink-mid);
                margin: 1.75rem 0;
                padding: 0.5rem 1.25rem;
                color: var(--ink-muted);
                font-style: italic;
            }
            .doc-body code {
                font-family: ui-monospace, monospace;
                background: rgba(28, 51, 37, 0.06);
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.82em;
                color: var(--ink);
            }
            .doc-body pre {
                background: rgba(28, 51, 37, 0.05);
                border: 1px solid var(--rule-md);
                padding: 1rem;
                border-radius: 4px;
                overflow-x: auto;
                margin: 1rem 0;
            }
            .doc-body pre code {
                background: none;
                padding: 0;
            }
            .doc-body table {
                width: 100%;
                border-collapse: collapse;
                margin: 1rem 0;
                font-family: "Inter", sans-serif;
                font-size: 0.82rem;
            }
            .doc-body th {
                text-align: left;
                padding: 0.5rem 0.75rem;
                border-bottom: 1px solid var(--ink);
                font-weight: 600;
                font-size: 0.68rem;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                color: var(--ink-sub);
            }
            .doc-body td {
                padding: 0.5rem 0.75rem;
                border-bottom: 1px solid var(--rule);
                color: var(--ink-muted);
            }
            .doc-body a {
                color: var(--ink-mid);
            }
            .doc-body hr {
                border: none;
                border-top: 1px solid var(--rule-md);
                margin: 2.25rem 0;
            }
            .doc-body strong {
                font-weight: 500;
            }

            .doc-body h1,
            .doc-body h2,
            .doc-body h3 {
                break-after: avoid;
                page-break-after: avoid;
            }
            .doc-body h1 + p,
            .doc-body h2 + p,
            .doc-body h3 + p,
            .doc-body h1 + ul,
            .doc-body h2 + ul,
            .doc-body h3 + ul {
                break-before: avoid;
                page-break-before: avoid;
            }
        </style>
        {% if theme %}
        <style>
            :root {
                --ink:       {{ theme.primary }};
                --ink-mid:   {{ theme.primary_mid }};
                --ink-muted: {{ theme.primary_mid }};
                --ink-sub:   {{ theme.primary_mid }};
            }
        </style>
        {% endif %}
    </head>
    <body>
        <div style="padding: 1.75rem 0 2rem">
            <!-- Title block — clean, no dark band -->
            <div
                style="
                    margin-bottom: 2rem;
                    padding-bottom: 1.25rem;
                    border-bottom: 1px solid var(--rule-md);
                "
            >
                <h1
                    class="serif"
                    style="
                        font-size: 2.25rem;
                        font-weight: 500;
                        font-style: italic;
                        letter-spacing: 0.01em;
                        margin: 0 0 0.6rem;
                        line-height: 1.2;
                        color: var(--ink);
                    "
                >
                    {{ title | default(value="") }}
                </h1>
                <div
                    style="
                        display: flex;
                        gap: 1.5rem;
                        font-size: 0.72rem;
                        font-family: &quot;Inter&quot;, sans-serif;
                        font-weight: 300;
                        letter-spacing: 0.08em;
                        text-transform: uppercase;
                        color: var(--ink-sub);
                        flex-wrap: wrap;
                    "
                >
                    {% if author %}<span>{{ author }}</span> {% elif me and
                    me.name %}<span>{{ me.name }}</span>{% endif %} {% if date
                    %}<span>{{ date }}</span>{% endif %}
                </div>
            </div>
            <div class="doc-body">{{ body | safe }}</div>
        </div>
    </body>
</html>
