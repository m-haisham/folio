[package]
name = "folio-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
folio-core = { path = "../folio-core" }
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
color-eyre = "0.6"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1" }
tabled = "0.15"
colored = "2"
dialoguer = "0.11"
serde_json = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
open = "5"
tempfile = "3"
