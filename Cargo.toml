[workspace]
members = ["crates/folio-core", "crates/folio-cli"]
resolver = "2"

[workspace.package]
repository = "https://github.com/m-haisham/folio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
eyre = "0.6"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
