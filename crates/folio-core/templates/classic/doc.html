<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ title | default(value="Document") }}</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @page { background: #fff; }
            @media print {
                body {
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                background: #fff;
                box-sizing: border-box;
            }
            body {
                font-family: Georgia, "Times New Roman", serif;
                color: #1a1a1a;
                font-size: 0.9rem;
            }

            .doc-body h1 {
                font-size: 1.4rem;
                font-weight: 700;
                margin: 2.25rem 0 0.75rem;
            }
            .doc-body h2 {
                font-size: 0.9rem;
                font-weight: 700;
                margin: 2rem 0 0.6rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                border-bottom: 1px solid #d1d5db;
                padding-bottom: 0.3rem;
            }
            .doc-body h3 {
                font-size: 1rem;
                font-weight: 700;
                margin: 1.5rem 0 0.5rem;
            }
            .doc-body p {
                margin: 1rem 0;
                line-height: 1.8;
            }
            .doc-body ul,
            .doc-body ol {
                margin: 1rem 0 1rem 1.6rem;
            }
            .doc-body ul {
                list-style-type: disc;
            }
            .doc-body ol {
                list-style-type: decimal;
            }
            .doc-body ul ul {
                list-style-type: circle;
            }
            .doc-body ul ul ul {
                list-style-type: square;
            }
            .doc-body li {
                margin-bottom: 0.3rem;
                line-height: 1.7;
            }
            .doc-body blockquote {
                border-left: 3px solid #9ca3af;
                margin: 1.5rem 0;
                padding: 0.5rem 1.25rem;
                color: #6b7280;
                font-style: italic;
            }
            .doc-body code {
                background: #f9fafb;
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.82em;
                font-family: ui-monospace, monospace;
            }
            .doc-body pre {
                background: #f9fafb;
                padding: 1rem 1.25rem;
                border-radius: 4px;
                overflow-x: auto;
                margin: 1rem 0;
                border: 1px solid #e5e7eb;
            }
            .doc-body pre code {
                background: none;
                padding: 0;
            }
            .doc-body table {
                width: 100%;
                border-collapse: collapse;
                margin: 1rem 0;
                font-size: 0.9em;
            }
            .doc-body th {
                text-align: left;
                padding: 0.5rem 0.75rem;
                border-bottom: 2px solid #1a1a1a;
                font-weight: 700;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.07em;
            }
            .doc-body td {
                padding: 0.5rem 0.75rem;
                border-bottom: 1px solid #e5e7eb;
            }
            .doc-body a {
                color: #1a1a1a;
            }
            .doc-body hr {
                border: none;
                border-top: 1px solid #d1d5db;
                margin: 2rem 0;
            }
            .doc-body strong {
                font-weight: 700;
            }

            .doc-body h1,
            .doc-body h2,
            .doc-body h3 {
                break-after: avoid;
                page-break-after: avoid;
            }
            .doc-body h1 + p,
            .doc-body h2 + p,
            .doc-body h3 + p,
            .doc-body h1 + ul,
            .doc-body h2 + ul,
            .doc-body h3 + ul {
                break-before: avoid;
                page-break-before: avoid;
            }
        </style>
    </head>
    <body>
        <div style="padding: 1.5rem 0 2rem">
            <div
                style="
                border-top: 4px solid {% if theme %}{{ theme.primary }}{% else %}#1a1a1a{% endif %};
                padding-top: 1.25rem;
                padding-bottom: 1rem;
                border-bottom: 1.5px solid {% if theme %}{{ theme.primary }}{% else %}#1a1a1a{% endif %};
                margin-bottom: 2rem;
            "
            >
                <h1
                    style="
                        font-size: 1.9rem;
                        font-weight: 700;
                        letter-spacing: 0.03em;
                        text-transform: uppercase;
                        margin: 0 0 0.4rem;
                        line-height: 1.15;
                    "
                >
                    {{ title | default(value="") }}
                </h1>
                <div
                    style="
                        display: flex;
                        gap: 1.5rem;
                        font-size: 0.8rem;
                        color: #6b7280;
                        flex-wrap: wrap;
                    "
                >
                    {% if author %}<span>{{ author }}</span> {% elif me and
                    me.name %}<span>{{ me.name }}</span>{% endif %} {% if date
                    %}<span>{{ date }}</span>{% endif %}
                </div>
            </div>
            <div class="doc-body" style="font-size: 0.92rem">
                {{ body | safe }}
            </div>
        </div>
    </body>
</html>
