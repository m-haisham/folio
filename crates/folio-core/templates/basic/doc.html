<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ title | default(value="Document") }}</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @page { background: #fff; }
            @media print {
                body {
                    -webkit-print-color-adjust: exact;
                    print-color-adjust: exact;
                }
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                background: #fff;
                box-sizing: border-box;
            }
            body {
                color: #111827;
                font-family: system-ui, sans-serif;
                font-size: 0.875rem;
            }

            .doc-body h1 {
                font-size: 1.5rem;
                font-weight: 700;
                margin: 2.25rem 0 0.75rem;
            }
            .doc-body h2 {
                font-size: 1.15rem;
                font-weight: 600;
                margin: 2rem 0 0.6rem;
                border-bottom: 1px solid #e5e7eb;
                padding-bottom: 0.25rem;
            }
            .doc-body h3 {
                font-size: 1rem;
                font-weight: 600;
                margin: 1.5rem 0 0.5rem;
            }
            .doc-body p {
                margin: 1rem 0;
                line-height: 1.75;
            }
            .doc-body ul,
            .doc-body ol {
                margin: 1rem 0 1rem 1.5rem;
            }
            .doc-body ul {
                list-style-type: disc;
            }
            .doc-body ol {
                list-style-type: decimal;
            }
            .doc-body ul ul {
                list-style-type: circle;
            }
            .doc-body ul ul ul {
                list-style-type: square;
            }
            .doc-body li {
                margin-bottom: 0.25rem;
                line-height: 1.65;
            }
            .doc-body blockquote {
                border-left: 3px solid #d1d5db;
                margin: 1.5rem 0;
                padding: 0.5rem 1rem;
                color: #6b7280;
                font-style: italic;
            }
            .doc-body code {
                background: #f3f4f6;
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.85em;
                font-family: ui-monospace, monospace;
            }
            .doc-body pre {
                background: #f3f4f6;
                padding: 1rem;
                border-radius: 6px;
                overflow-x: auto;
                margin: 1rem 0;
            }
            .doc-body pre code {
                background: none;
                padding: 0;
            }
            .doc-body table {
                width: 100%;
                border-collapse: collapse;
                margin: 1rem 0;
                font-size: 0.9em;
            }
            .doc-body th {
                text-align: left;
                padding: 0.5rem 0.75rem;
                border-bottom: 2px solid #e5e7eb;
                font-weight: 600;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #6b7280;
            }
            .doc-body td {
                padding: 0.5rem 0.75rem;
                border-bottom: 1px solid #f3f4f6;
            }
            .doc-body a {
                color: #111827;
                text-decoration: underline;
            }
            .doc-body hr {
                border: none;
                border-top: 1px solid #e5e7eb;
                margin: 2rem 0;
            }
            .doc-body strong {
                font-weight: 600;
            }

            .doc-body h1,
            .doc-body h2,
            .doc-body h3 {
                break-after: avoid;
                page-break-after: avoid;
            }
            .doc-body h1 + p,
            .doc-body h2 + p,
            .doc-body h3 + p,
            .doc-body h1 + ul,
            .doc-body h2 + ul,
            .doc-body h3 + ul {
                break-before: avoid;
                page-break-before: avoid;
            }

            .doc-accent-bar {
                height: 4px;
                width: 100%;
                background: #e5e7eb;
            }
        </style>
        {% if theme %}
        <style>
            .doc-accent-bar { background: {{ theme.primary }} !important; }
            .doc-body h2 { border-color: {{ theme.primary_light }} !important; }
            .doc-body blockquote { border-left-color: {{ theme.primary_mid }} !important; }
            .doc-body a { color: {{ theme.primary }} !important; }
        </style>
        {% endif %}
    </head>
    <body>
        <div class="doc-accent-bar"></div>
        <div style="padding: 1.75rem 0 2rem">
            <div
                style="
                    margin-bottom: 2rem;
                    padding-bottom: 1.25rem;
                    border-bottom: 1px solid #e5e7eb;
                "
            >
                <h1
                    style="
                        font-size: 1.9rem;
                        font-weight: 700;
                        letter-spacing: -0.02em;
                        margin: 0 0 0.4rem;
                        line-height: 1.2;
                    "
                >
                    {{ title | default(value="") }}
                </h1>
                <div
                    style="
                        display: flex;
                        gap: 1.5rem;
                        color: #6b7280;
                        font-size: 0.8rem;
                        flex-wrap: wrap;
                    "
                >
                    {% if author %}<span>{{ author }}</span> {% elif me and
                    me.name %}<span>{{ me.name }}</span>{% endif %} {% if date
                    %}<span>{{ date }}</span>{% endif %}
                </div>
            </div>
            <div class="doc-body">{{ body | safe }}</div>
        </div>
    </body>
</html>
