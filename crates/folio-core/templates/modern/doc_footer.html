<div
    style="
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        background-color: #fff;
        width: 100%;
        box-sizing: border-box;
        border-top: 1px solid #f3f4f6;
        margin-top: 4px;
    "
>
    <div
        style="
            font-family: system-ui, sans-serif;
            font-size: 8px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0.8in 3px;
        "
    >
        <span
            >{% if me and me.name %}{{ me.name }}{% if me.company %} · {{
            me.company }}{% endif %}{% endif %}</span
        >
        <span>{% if me and me.email %}{{ me.email }}{% endif %}</span>
    </div>
    <div
        style="-webkit-print-color-adjust: exact; print-color-adjust: exact; height: 3px; width: 100%; background: {% if theme %}{{ theme.primary }}{% else %}#7c3aed{% endif %};"
    ></div>
</div>
